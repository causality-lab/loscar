[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loscar"
version = "1.0"
description = "Loscar: Location-Scale RESIT."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Daniel Klippert", email = "daniel.klippert@tu-dortmund.de" },
    { name = "Alexander Marx", email = "uniamarx@gmail.com" },
]
urls = {homepage = "https://github.com/causality-lab/Loscar"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "tabpfn>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loscar*"]

