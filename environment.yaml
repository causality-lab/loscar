# Environment for Loscar
# R related packages are only needed for SID metric.
name: loscar-env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy>=2
  - scipy>=1.15,<1.17  # skewt-scipy imports scipy._lib.array_api_extra (gone in 1.17)
  - pandas
  - scikit-learn
  - statsmodels
  - python-igraph      # data/dgp.py
  # conda-forge installs the CUDA build when an NVIDIA driver is detected, else the CPU
  # build. To force a CPU-only install on a GPU machine, replace the line below with:
  #   - pytorch=*=cpu*
  - pytorch
  - lightgbm           # tabpfn dependency
  # R toolchain for the SID metric (cdt.metrics), R packages via setupR.R
  - r-base>=4.3
  - bioconductor-graph
  - bioconductor-rbgl
  - compilers
  - make
  - pip
  - pip:
      - tabpfn>=8.0
      - skewt-scipy    # data/dgp.py
      - cdt>=0.6       # SHD/SID metrics
      - causalchamber  # LightTunnel dataset
